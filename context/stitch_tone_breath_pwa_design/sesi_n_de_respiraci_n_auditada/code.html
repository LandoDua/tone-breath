<style>
        /* Custom animation for the empathetic breathing pulse */
        @keyframes pulse-breathe {
            0% { transform: scale(0.4); opacity: 0.9; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.4); opacity: 0.9; }
        }
        .animate-breathe {
            animation: pulse-breathe 8s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-[884px] flex flex-col font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Contextual Header (Task-Focused: Suppressing global TopAppBar) -->
<header class="flex items-center justify-between px-container-margin h-16 w-full max-w-[480px] mx-auto z-10">
<button aria-label="Cerrar sesión" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95 text-on-surface">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Dormir</h1>
<div class="w-12 h-12"></div> <!-- Spacer for perfect centering -->
</header>
<!-- Main Breathing Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-[480px] mx-auto px-container-margin relative">
<!-- The Pulse - Central Breathing Guide -->
<div class="relative w-[320px] h-[320px] flex items-center justify-center mb-16">
<!-- Ambient Limit Shadow (10% opacity ring marking max boundary) -->
<div class="absolute inset-0 rounded-full border-[2px] border-primary-container/10 shadow-[0_0_60px_rgba(20,184,166,0.05)] pointer-events-none"></div>
<!-- Expanding/Contracting Teal Circle -->
<div class="absolute inset-0 bg-primary-container rounded-full flex items-center justify-center animate-breathe shadow-lg shadow-primary-container/20">
<span class="font-display-mobile text-display-mobile text-on-primary-container select-none">Inhala</span>
</div>
</div>
<!-- Phase Map Indicator -->
<div class="flex items-center gap-4 text-on-surface-variant font-body-lg text-body-lg mt-12">
<!-- Active Phase -->
<div aria-label="Fase actual: 4 segundos" class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary font-bold shadow-sm">
                4
            </div>
<!-- Inactive Phases -->
<span class="opacity-30 font-light">-</span>
<span class="opacity-30 font-light">7</span>
<span class="opacity-30 font-light">-</span>
<span class="opacity-30 font-light">8</span>
</div>
</main>
<!-- Footer Controls -->
<footer class="flex flex-col items-center pb-12 w-full max-w-[480px] mx-auto z-10 gap-12">
<!-- Timer -->
<div aria-label="Tiempo restante: 3 minutos y 45 segundos" class="font-display-mobile text-display-mobile text-on-surface tabular-nums tracking-wide opacity-90">
            03:45
        </div>
<!-- Secondary Ghost Button -->
<button class="bg-surface-variant text-on-surface-variant px-10 py-4 rounded-full font-label-lg text-label-lg hover:bg-surface-dim transition-transform duration-200 active:scale-95 shadow-[0_2px_10px_rgba(0,0,0,0.02)]">
            Finalizar
        </button>
</footer>
